schema: spec-driven

context: |
  Landing/funnel de Andes (andesrc.com): React 18 + TypeScript + Vite + Tailwind + Radix, Framer Motion/GSAP, bilingüe ES/EN (dos builds).
  Objetivo único: convertir visitantes en conversación de WhatsApp (POST /onboarding/start -> wa.me). Ver spec onboarding-funnel.
  Copy centralizado en src/data/content.tsx; CTAs vía src/lib/onboarding.ts; analytics en src/lib/analytics.ts; imports con alias @/.
  Contexto de negocio 2026-07: pivote a club de experiencia wellness en Pamplona, ICP mujer principiante — ver docs/prd-experience-club-pamplona-2026-07.md.
  Antes de PR: npm run lint, type-check y test deben pasar. No editar dist/.

